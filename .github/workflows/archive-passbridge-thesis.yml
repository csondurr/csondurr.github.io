name: Archive PASSBRIDGE thesis PDF

on:
  push:
    paths:
      - ".github/workflows/archive-passbridge-thesis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy original thesis from public PASSBRIDGE repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/research
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/csondurr/PASSBRIDGE/main/PASSBRIDGE_Thesis.pdf" \
            --output assets/research/PASSBRIDGE_Thesis.pdf
          test "$(wc -c < assets/research/PASSBRIDGE_Thesis.pdf)" -eq 1246730
          file assets/research/PASSBRIDGE_Thesis.pdf | grep -q "PDF document"
      - name: Commit original PDF to site archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research/PASSBRIDGE_Thesis.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: add PASSBRIDGE original thesis PDF to site archive"
            git push
          fi
