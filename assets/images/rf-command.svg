<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Adaptive RF aperture and digital beamforming visualization</title>
<desc id="desc">Animated professional engineering interface showing a phased-array aperture, precision beam steering, telemetry, spectrum and signal tracking.</desc>
<defs>
  <pattern id="minorGrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#9caf67" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
    <rect width="120" height="120" fill="url(#minorGrid)"/>
    <path d="M120 0H0V120" fill="none" stroke="#bacb82" stroke-opacity=".09" stroke-width="1"/>
  </pattern>
  <radialGradient id="backgroundGlow" cx="57%" cy="43%" r="72%">
    <stop offset="0" stop-color="#26341b" stop-opacity=".58"/>
    <stop offset=".46" stop-color="#111b0d" stop-opacity=".28"/>
    <stop offset="1" stop-color="#050905" stop-opacity=".96"/>
  </radialGradient>
  <radialGradient id="coreGlow">
    <stop offset="0" stop-color="#f2ffc3" stop-opacity=".95"/>
    <stop offset=".16" stop-color="#cfe791" stop-opacity=".6"/>
    <stop offset=".52" stop-color="#8fa956" stop-opacity=".18"/>
    <stop offset="1" stop-color="#8fa956" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beamMain" x1="0" y1=".5" x2="1" y2=".5">
    <stop offset="0" stop-color="#dff5a0" stop-opacity=".46"/>
    <stop offset=".48" stop-color="#b9d278" stop-opacity=".2"/>
    <stop offset="1" stop-color="#9cb164" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beamFine" x1="0" y1=".5" x2="1" y2=".5">
    <stop offset="0" stop-color="#efffbc" stop-opacity=".78"/>
    <stop offset=".72" stop-color="#b4ce73" stop-opacity=".2"/>
    <stop offset="1" stop-color="#b4ce73" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="panelFade" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#172410" stop-opacity=".86"/>
    <stop offset="1" stop-color="#091008" stop-opacity=".52"/>
  </linearGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="pinGlow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="scopeClip"><rect x="42" y="34" width="1116" height="652" rx="2"/></clipPath>
</defs>
<style>
  .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;letter-spacing:2px}
  .fine{fill:none;stroke:#c7d991;stroke-width:1}
  .muted{fill:none;stroke:#91a75e;stroke-width:1}
  .dash{stroke-dasharray:7 9}
  .sweep{transform-origin:675px 334px;animation:sweep 10s linear infinite}
  .scanline{animation:scan 5.6s ease-in-out infinite}
  .beam-a{animation:beamA 5.2s ease-in-out infinite}
  .beam-b{animation:beamB 5.2s ease-in-out 1.7s infinite}
  .beam-c{animation:beamC 5.2s ease-in-out 3.1s infinite}
  .flow{stroke-dasharray:10 16;animation:flow 2.7s linear infinite}
  .flow-fast{stroke-dasharray:3 14;animation:flow 1.6s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
  .pulse-delay{animation-delay:1.1s}
  .orbit{transform-origin:675px 334px;animation:orbit 17s linear infinite}
  .orbit-rev{transform-origin:675px 334px;animation:orbitRev 23s linear infinite}
  .wave{stroke-dasharray:850;stroke-dashoffset:850;animation:trace 5s ease-in-out infinite}
  .bars rect{transform-box:fill-box;transform-origin:center bottom;animation:bars 2.8s ease-in-out infinite}
  .bars rect:nth-child(2n){animation-delay:-.7s}.bars rect:nth-child(3n){animation-delay:-1.4s}
  .status{animation:status 1.9s ease-in-out infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes orbitRev{to{transform:rotate(-360deg)}}
  @keyframes flow{to{stroke-dashoffset:-52}}
  @keyframes pulse{0%{transform:scale(.55);opacity:.95}75%,100%{transform:scale(1.9);opacity:0}}
  @keyframes trace{0%{stroke-dashoffset:850}42%,72%{stroke-dashoffset:0}100%{stroke-dashoffset:-850}}
  @keyframes scan{0%,100%{transform:translateY(-140px);opacity:0}12%,88%{opacity:.58}50%{transform:translateY(140px)}}
  @keyframes beamA{0%,100%{opacity:.28}38%,58%{opacity:.96}}
  @keyframes beamB{0%,100%{opacity:.18}38%,58%{opacity:.84}}
  @keyframes beamC{0%,100%{opacity:.12}38%,58%{opacity:.66}}
  @keyframes bars{0%,100%{transform:scaleY(.55);opacity:.55}50%{transform:scaleY(1);opacity:1}}
  @keyframes status{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.sweep,.scanline,.beam-a,.beam-b,.beam-c,.flow,.flow-fast,.pulse,.orbit,.orbit-rev,.wave,.bars rect,.status{animation:none}}
</style>
<g clip-path="url(#scopeClip)">
  <rect width="1200" height="720" fill="#050905"/>
  <rect width="1200" height="720" fill="url(#backgroundGlow)"/>
  <rect width="1200" height="720" fill="url(#majorGrid)"/>
  <path d="M0 92H1200M0 608H1200" stroke="#b8cb7d" stroke-opacity=".09"/>
  <rect class="scanline" x="42" y="329" width="1116" height="2" fill="#d7ed9d" opacity=".38"/>
  <g opacity=".9">
    <path d="M44 108V42H110M1090 42h66v66M44 612v66h66M1090 678h66v-66" fill="none" stroke="#718449" stroke-width="2"/>
    <path d="M61 108V59h49M1090 59h49v49M61 612v49h49M1090 661h49v-49" fill="none" stroke="#adc476" stroke-opacity=".32"/>
  </g>

  <g class="mono" font-size="11" fill="#aabd73">
    <text x="75" y="82">ADAPTIVE APERTURE // LIVE</text>
    <text x="75" y="103" fill="#6f824c">MULTI-BEAM DIGITAL FORMATION</text>
    <text x="934" y="82">CARRIER</text><text x="1034" y="82" fill="#d8e8a5">5.800 GHz</text>
    <text x="934" y="103">REFERENCE</text><text x="1034" y="103" fill="#d8e8a5">10 MHz / LOCK</text>
  </g>
  <g transform="translate(75 137)">
    <rect width="238" height="386" rx="3" fill="url(#panelFade)" stroke="#70834a" stroke-opacity=".55"/>
    <path d="M18 55H220M18 302H220" stroke="#8ea45b" stroke-opacity=".25"/>
    <text x="18" y="28" class="mono" font-size="10" fill="#91a65f">ARRAY ELEMENT STATUS</text>
    <text x="190" y="28" class="mono status" font-size="9" fill="#e6f8ad">64/64</text>
    <g transform="translate(42 76)" fill="#26361b" stroke="#879c57" stroke-opacity=".48">
      <circle cx="18" cy="18" r="10"/><circle cx="48" cy="18" r="10"/><circle cx="78" cy="18" r="10"/><circle cx="108" cy="18" r="10"/><circle cx="138" cy="18" r="10"/>
      <circle cx="18" cy="48" r="10"/><circle cx="48" cy="48" r="10"/><circle cx="78" cy="48" r="10"/><circle cx="108" cy="48" r="10"/><circle cx="138" cy="48" r="10"/>
      <circle cx="18" cy="78" r="10"/><circle cx="48" cy="78" r="10"/><circle cx="78" cy="78" r="10"/><circle cx="108" cy="78" r="10"/><circle cx="138" cy="78" r="10"/>
      <circle cx="18" cy="108" r="10"/><circle cx="48" cy="108" r="10"/><circle cx="78" cy="108" r="10"/><circle cx="108" cy="108" r="10"/><circle cx="138" cy="108" r="10"/>
      <circle cx="18" cy="138" r="10"/><circle cx="48" cy="138" r="10"/><circle cx="78" cy="138" r="10"/><circle cx="108" cy="138" r="10"/><circle cx="138" cy="138" r="10"/>
      <g fill="#cde391" filter="url(#pinGlow)">
        <circle cx="18" cy="18" r="2.2"/><circle cx="48" cy="48" r="2.2"/><circle cx="78" cy="78" r="2.2"/><circle cx="108" cy="108" r="2.2"/><circle cx="138" cy="138" r="2.2"/>
        <circle cx="138" cy="18" r="2.2"/><circle cx="108" cy="48" r="2.2"/><circle cx="48" cy="108" r="2.2"/><circle cx="18" cy="138" r="2.2"/>
      </g>
    </g>
    <g class="mono" font-size="9" fill="#788d50">
      <text x="18" y="326">CALIBRATION</text><text x="166" y="326" fill="#cfe391">NOMINAL</text>
      <text x="18" y="348">PHASE ERROR</text><text x="166" y="348" fill="#cfe391">0.18°</text>
      <text x="18" y="370">APERTURE EFF.</text><text x="166" y="370" fill="#cfe391">92.4%</text>
    </g>
  </g>

  <g>
    <circle cx="675" cy="334" r="206" fill="#0a1108" fill-opacity=".3" stroke="#849851" stroke-opacity=".22"/>
    <circle cx="675" cy="334" r="164" fill="none" stroke="#849851" stroke-opacity=".23"/>
    <circle cx="675" cy="334" r="122" fill="none" stroke="#a4b96d" stroke-opacity=".28"/>
    <circle cx="675" cy="334" r="78" fill="none" stroke="#bdcf83" stroke-opacity=".34"/>
    <circle cx="675" cy="334" r="37" fill="url(#coreGlow)" stroke="#e1f2aa" stroke-opacity=".72"/>
    <g class="sweep">
      <path d="M675 334L675 123A211 211 0 0 1 824 185Z" fill="url(#beamMain)" opacity=".7"/>
      <path d="M675 334L675 123" stroke="#d9eea0" stroke-opacity=".72"/>
    </g>
    <g class="orbit" fill="#d9eca3">
      <circle cx="675" cy="128" r="3" filter="url(#pinGlow)"/>
      <circle cx="838" cy="208" r="2.5"/>
      <circle cx="512" cy="460" r="2"/>
    </g>
    <g class="orbit-rev" fill="#9db267">
      <circle cx="675" cy="170" r="2.5"/>
      <circle cx="560" cy="397" r="2"/>
      <circle cx="790" cy="272" r="2"/>
    </g>
    <path d="M469 334H881M675 128V540" stroke="#809552" stroke-opacity=".18" stroke-dasharray="4 8"/>
    <path d="M511 334A164 164 0 0 1 839 334M553 334A122 122 0 0 1 797 334" fill="none" stroke="#bdcf83" stroke-opacity=".22" stroke-dasharray="3 11"/>
    <g class="mono" font-size="9" fill="#829754">
      <text x="659" y="115">000°</text><text x="872" y="338">090°</text><text x="652" y="558">180°</text><text x="451" y="338">270°</text>
    </g>
  </g>

  <g>
    <path class="beam-a" d="M700 321L1085 164L713 344Z" fill="url(#beamMain)"/>
    <path class="beam-b" d="M708 338L1090 347L708 352Z" fill="url(#beamFine)"/>
    <path class="beam-c" d="M700 355L1056 503L710 368Z" fill="url(#beamMain)"/>
    <path class="flow beam-a" d="M705 333Q864 243 1084 164" fill="none" stroke="#e1f3aa" stroke-width="1.5"/>
    <path class="flow-fast beam-b" d="M710 344Q877 350 1090 347" fill="none" stroke="#d8ed9e" stroke-width="1.2"/>
    <path class="flow beam-c" d="M704 357Q864 421 1056 503" fill="none" stroke="#b8d17b" stroke-width="1.2"/>
    <g>
      <circle cx="1085" cy="164" r="19" fill="none" stroke="#bed786" stroke-opacity=".2" class="pulse"/>
      <circle cx="1085" cy="164" r="5" fill="#e4f5ae" filter="url(#pinGlow)"/>
      <path d="M1069 164h32M1085 148v32" stroke="#d8eca1" stroke-opacity=".75"/>
      <text x="1001" y="143" class="mono" font-size="9" fill="#a9be70">TRACK A // 031°</text>
    </g>
    <g>
      <circle cx="1090" cy="347" r="19" fill="none" stroke="#bed786" stroke-opacity=".2" class="pulse pulse-delay"/>
      <circle cx="1090" cy="347" r="4" fill="#d8ec9f" filter="url(#pinGlow)"/>
      <path d="M1076 347h28M1090 333v28" stroke="#d8eca1" stroke-opacity=".65"/>
      <text x="995" y="326" class="mono" font-size="9" fill="#a9be70">TRACK B // 089°</text>
    </g>
    <g>
      <circle cx="1056" cy="503" r="18" fill="none" stroke="#a8c272" stroke-opacity=".18" class="pulse"/>
      <circle cx="1056" cy="503" r="3.5" fill="#bfd587"/>
      <text x="965" y="533" class="mono" font-size="9" fill="#8fa45d">TRACK C // 142°</text>
    </g>
  </g>

  <g transform="translate(342 566)">
    <rect width="816" height="93" rx="2" fill="#071006" fill-opacity=".76" stroke="#74884c" stroke-opacity=".48"/>
    <path d="M16 48H800M222 10V83M619 10V83" stroke="#819654" stroke-opacity=".18"/>
    <text x="16" y="22" class="mono" font-size="9" fill="#8da259">COMPOSITE SPECTRUM</text>
    <path d="M16 66C35 64 44 62 59 62S81 66 98 65s24-6 38-7c24-2 31 9 48 8 12-1 19-4 31-4" fill="none" stroke="#71844c" stroke-opacity=".6"/>
    <path class="wave" d="M16 66C37 66 45 62 59 62 74 62 83 66 98 65 119 64 122 57 138 58 160 59 163 70 181 65 199 60 199 42 213 34" fill="none" stroke="#d4e99b" stroke-width="2" filter="url(#pinGlow)"/>
    <text x="243" y="22" class="mono" font-size="9" fill="#8da259">BEAM QUALITY</text>
    <g class="bars" transform="translate(243 34)" fill="#9eb668">
      <rect x="0" y="27" width="8" height="18"/><rect x="15" y="20" width="8" height="25"/><rect x="30" y="12" width="8" height="33"/>
      <rect x="45" y="4" width="8" height="41"/><rect x="60" y="9" width="8" height="36"/><rect x="75" y="17" width="8" height="28"/>
      <rect x="90" y="25" width="8" height="20"/><rect x="105" y="31" width="8" height="14"/>
    </g>
    <text x="385" y="51" class="mono" font-size="9" fill="#d7eaa0">SLL −24.8 dB</text>
    <text x="640" y="22" class="mono" font-size="9" fill="#8da259">SYSTEM STATE</text>
    <circle cx="648" cy="48" r="4" fill="#dff2a7" filter="url(#pinGlow)" class="status"/>
    <text x="663" y="52" class="mono" font-size="11" fill="#d8eba1">BEAM LOCKED</text>
    <text x="640" y="74" class="mono" font-size="9" fill="#879b57">SNR 28.6 dB  //  LATENCY 3.2 ms</text>
  </g>
</g>
<rect x="1" y="1" width="1198" height="718" fill="none" stroke="#9aad65" stroke-opacity=".28"/>
</svg>