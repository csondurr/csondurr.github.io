<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RF command systems visualization</title>
  <desc id="desc">A tactical display with a phased array, directional beams, radar rings, and signal traces.</desc>
  <defs>
    <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8b9c66" stroke-opacity=".07"/>
    </pattern>
    <pattern id="largeGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#smallGrid)"/>
      <path d="M120 0H0V120" fill="none" stroke="#a8b87b" stroke-opacity=".11"/>
    </pattern>
    <radialGradient id="glow" cx="68%" cy="45%" r="52%">
      <stop offset="0" stop-color="#93aa60" stop-opacity=".2"/>
      <stop offset=".56" stop-color="#354725" stop-opacity=".07"/>
      <stop offset="1" stop-color="#071006" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop stop-color="#a9bd75" stop-opacity=".05"/>
      <stop offset="1" stop-color="#c5d897" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop stop-color="#718050" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#c4d395" stop-opacity=".86"/>
      <stop offset="1" stop-color="#718050" stop-opacity=".24"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#080d07"/>
  <rect width="1200" height="720" fill="url(#largeGrid)"/>
  <rect width="1200" height="720" fill="url(#glow)"/>
  <path d="M0 95H1200M0 625H1200" stroke="#98a971" stroke-opacity=".1"/>
