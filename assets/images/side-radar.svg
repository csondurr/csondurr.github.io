<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 760" role="img" aria-labelledby="title desc">
<title id="title">RF radar telemetry</title>
<desc id="desc">Animated radar sweep, RF waveform and antenna field telemetry.</desc>
<style>
  .grid{stroke:#839760;stroke-opacity:.13;stroke-width:.7}
  .line{fill:none;stroke:#a8bd7a;stroke-opacity:.42;stroke-width:1}
  .strong{fill:none;stroke:#c3d597;stroke-opacity:.72;stroke-width:1.2}
  .dim{fill:#91a56b;fill-opacity:.68;font:8px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px}
  .micro{fill:#81945f;fill-opacity:.72;font:6px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px}
  .sweep{transform-origin:140px 170px;animation:rotate 10s linear infinite}
  .dash{stroke-dasharray:8 8;animation:flow 4s linear infinite}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  .pulse2{animation:pulse 2.8s 1.1s ease-in-out infinite}
  @keyframes rotate{to{transform:rotate(360deg)}}
  @keyframes flow{to{stroke-dashoffset:-64}}
  @keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}
</style>
<defs>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="grid"/></pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#b8cc88" stop-opacity=".26"/><stop offset="1" stop-color="#b8cc88" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#b9cc88" stop-opacity=".02"/><stop offset="1" stop-color="#c9d99d" stop-opacity=".38"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect x="1" y="1" width="278" height="758" rx="5" fill="#0b1108" fill-opacity=".18" stroke="#9bad71" stroke-opacity=".18"/>
<path d="M1 58H279M1 366H279M1 570H279" class="grid"/>
<rect x="12" y="72" width="256" height="276" fill="url(#g)" opacity=".58"/>
<path d="M12 40V14H38M242 14h26v26M12 720v26h26M242 746h26v-26" class="strong"/>
<text x="20" y="32" class="dim">RF FIELD / LIVE</text>
<text x="200" y="32" class="micro">5.800 GHz</text>
<circle cx="140" cy="170" r="102" fill="url(#glow)"/>
<g class="line">
  <circle cx="140" cy="170" r="92"/><circle cx="140" cy="170" r="69"/><circle cx="140" cy="170" r="46"/><circle cx="140" cy="170" r="23"/>
  <path d="M38 170h204M140 68v204M68 98l144 144M212 98 68 242"/>
</g>
<g class="sweep">
  <path d="M140 170 224 93A114 114 0 0 1 247 126Z" fill="url(#beam)"/>
  <path d="M140 170 229 89" class="strong"/>
</g>
<g fill="#c5d898">
  <circle cx="87" cy="127" r="2.6" class="pulse"/><circle cx="195" cy="145" r="2.2" class="pulse2"/>
  <circle cx="167" cy="220" r="2.5" class="pulse"/><circle cx="112" cy="198" r="1.8" class="pulse2"/>
</g>
<circle cx="140" cy="170" r="3.8" fill="#d4e2ad" opacity=".9"/>
<text x="22" y="294" class="micro">AZ 042.7°</text><text x="197" y="294" class="micro">RNG 2.4 km</text>
<path d="M20 327h28l8-14 10 29 12-41 13 35 10-20 13 10 12-25 13 38 11-17 12 4 13-31 12 40 11-19 14 10 13-21 12 22 11-7h31" class="strong dash"/>
<text x="20" y="386" class="dim">COMPLEX BASEBAND</text>
<path d="M20 428C37 389 53 468 70 428S103 389 120 428s33 39 50 0 33-39 50 0 25 20 40 0" class="line dash"/>
<path d="M20 472C37 438 53 506 70 472s33-34 50 0 33 34 50 0 33-34 50 0 25 17 40 0" class="strong"/>
<path d="M20 520h240M20 536h196" class="grid"/>
<text x="20" y="555" class="micro">I/Q SYNC  99.97%</text>
<text x="20" y="596" class="dim">ANTENNA FIELD</text>
<g transform="translate(140 690)" class="line">
  <path d="M0 35V-2M-12 35h24M-5-2 0-16 5-2"/>
  <path d="M-18-12Q0-30 18-12M-34-2Q0-42 34-2M-52 10Q0-58 52 10" class="strong"/>
  <path d="M-70 24Q0-74 70 24" class="line dash"/>
</g>
<text x="20" y="734" class="micro">LINK STABLE</text><circle cx="242" cy="731" r="3" fill="#c8d99b" class="pulse"/>
</svg>