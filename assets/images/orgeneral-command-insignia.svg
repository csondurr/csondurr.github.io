<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 112" role="img" aria-labelledby="title desc">
<title id="title">Orgeneral rank insignia</title>
<desc id="desc">Four stars above a stylized crossed-sword, laurel and crescent-star emblem.</desc>
<style>
.gold{fill:#c8d69a;stroke:#d8e3b1;stroke-width:.7}.line{fill:none;stroke:#bdcd8d;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.dim{fill:none;stroke:#839760;stroke-opacity:.5;stroke-width:.7}.label{fill:#9eb273;font:6px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px}.stars{animation:p 4.8s ease-in-out infinite}.crest{animation:p 4.8s 1.1s ease-in-out infinite}.scan{animation:s 5.5s linear infinite}@keyframes p{0%,100%{opacity:.72}50%{opacity:1}}@keyframes s{0%{transform:translateX(-100px);opacity:0}20%,65%{opacity:.5}100%{transform:translateX(300px);opacity:0}}
</style>
<defs>
<linearGradient id="panel"><stop stop-color="#26331c" stop-opacity=".15"/><stop offset=".5" stop-color="#4c6035" stop-opacity=".24"/><stop offset="1" stop-color="#26331c" stop-opacity=".15"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#dce7b8" stop-opacity="0"/><stop offset=".5" stop-color="#edf3d2" stop-opacity=".65"/><stop offset="1" stop-color="#dce7b8" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.2"/></filter>
<path id="star" d="M0-9.5 2.25-3.1 9.05-2.95 3.6 1.18 5.6 7.7 0 3.9-5.6 7.7-3.6 1.18-9.05-2.95-2.25-3.1Z"/>
<clipPath id="frame"><rect x="1" y="1" width="278" height="110" rx="4"/></clipPath>
</defs>
<rect x="1" y="1" width="278" height="110" rx="4" fill="url(#panel)" stroke="#aabe7b" stroke-opacity=".28"/>
<path d="M1 20V1h20M259 1h20v19M1 92v19h20M259 111h20V92" class="dim"/>
<text x="12" y="14" class="label">ORGENERAL // OF-9</text><text x="212" y="14" class="label">COMMAND</text>
<g class="stars gold" transform="translate(0 29)"><use href="#star" transform="translate(104)"/><use href="#star" transform="translate(128)"/><use href="#star" transform="translate(152)"/><use href="#star" transform="translate(176)"/></g>
<g opacity=".22" filter="url(#glow)" fill="#dce8af"><circle cx="104" cy="29" r="11"/><circle cx="128" cy="29" r="11"/><circle cx="152" cy="29" r="11"/><circle cx="176" cy="29" r="11"/></g>
<g class="crest">
<g class="line"><path d="M111 98 165 53M115 50l54 48"/><path d="m108 94 8 7 5-8M172 94l-8 7-5-8"/></g>
<path d="M111 98C93 85 96 65 115 54M169 98c18-13 15-33-4-44" class="line"/>
<g class="gold">
<ellipse cx="105" cy="89" rx="2.2" ry="5" transform="rotate(-42 105 89)"/><ellipse cx="102" cy="80" rx="2.2" ry="5" transform="rotate(-24 102 80)"/><ellipse cx="104" cy="70" rx="2.2" ry="5" transform="rotate(-8 104 70)"/><ellipse cx="111" cy="60" rx="2.2" ry="5" transform="rotate(22 111 60)"/>
<ellipse cx="175" cy="89" rx="2.2" ry="5" transform="rotate(42 175 89)"/><ellipse cx="178" cy="80" rx="2.2" ry="5" transform="rotate(24 178 80)"/><ellipse cx="176" cy="70" rx="2.2" ry="5" transform="rotate(8 176 70)"/><ellipse cx="169" cy="60" rx="2.2" ry="5" transform="rotate(-22 169 60)"/>
</g>
<circle cx="140" cy="77" r="20" fill="#1a2414" stroke="#c7d697" stroke-width="1.6"/><circle cx="140" cy="77" r="15.5" fill="#7d3128" stroke="#d3dfa9" stroke-width=".8"/>
<circle cx="136.5" cy="76.5" r="7" fill="#e1e8bd"/><circle cx="139.5" cy="74.5" r="6.4" fill="#7d3128"/>
<path d="M146 70.5 147.3 74.2h3.9l-3.1 2.3 1.2 3.7-3.3-2.2-3.2 2.2 1.2-3.7-3.2-2.3h4Z" fill="#e1e8bd"/>
</g>
<g clip-path="url(#frame)" class="scan"><rect x="-50" width="26" height="112" fill="url(#shine)" transform="skewX(-18)"/></g>
<path d="M12 102h72M196 102h72" class="dim"/>
</svg>